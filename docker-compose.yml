services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: halo-rag-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-halo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-halo_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-halo_rag}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
      - ./docker/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-halo} -d ${POSTGRES_DB:-halo_rag}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  pgvector_data:
