services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: spark-rag-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-spark}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-spark_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-spark_rag}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
      - ./docker/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spark-rag-api
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-spark}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-spark_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-spark_rag}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-gemini-embedding-001}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-768}
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      GEMINI_CHAT_MODEL: ${GEMINI_CHAT_MODEL:-gemini-3.8-flash}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.4}
      LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-1024}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-90}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-2}
      LLM_FALLBACK_PROVIDERS: ${LLM_FALLBACK_PROVIDERS:-}
      LLM_FALLBACK_TIMEOUT_SECONDS: ${LLM_FALLBACK_TIMEOUT_SECONDS:-30}
      LLM_PRIMARY_COOLDOWN_SECONDS: ${LLM_PRIMARY_COOLDOWN_SECONDS:-60}
      OPENAI_COMPAT_API_KEY: ${OPENAI_COMPAT_API_KEY:-}
      OPENAI_COMPAT_BASE_URL: ${OPENAI_COMPAT_BASE_URL:-https://integrate.api.nvidia.com/v1}
      OPENAI_COMPAT_CHAT_MODEL: ${OPENAI_COMPAT_CHAT_MODEL:-}
      OPENAI_COMPAT_LABEL: ${OPENAI_COMPAT_LABEL:-nvidia}
      OPENAI_COMPAT_STRUCTURED_MODE: ${OPENAI_COMPAT_STRUCTURED_MODE:-auto}
      OPENAI_COMPAT_TIMEOUT_SECONDS: ${OPENAI_COMPAT_TIMEOUT_SECONDS:-60}
      OPENAI_COMPAT_MAX_OUTPUT_TOKENS: ${OPENAI_COMPAT_MAX_OUTPUT_TOKENS:-2048}
      OPENAI_COMPAT_EXTRA_BODY: ${OPENAI_COMPAT_EXTRA_BODY:-}
      RETRIEVAL_TOP_K: ${RETRIEVAL_TOP_K:-5}
      RETRIEVAL_MIN_SIMILARITY: ${RETRIEVAL_MIN_SIMILARITY:-0.68}
      RETRIEVAL_CATEGORIES: ${RETRIEVAL_CATEGORIES:-}
      CHAT_HISTORY_MAX_MESSAGES: ${CHAT_HISTORY_MAX_MESSAGES:-10}
      CHAT_HISTORY_MAX_CHARS: ${CHAT_HISTORY_MAX_CHARS:-6000}
      CHAT_MESSAGE_MAX_CHARS: ${CHAT_MESSAGE_MAX_CHARS:-2000}
      DATA_DIR: /app/data
      COLLECTION_NAME: ${COLLECTION_NAME:-spark_documents}
      CHUNK_SIZE: ${CHUNK_SIZE:-1000}
      CHUNK_OVERLAP: ${CHUNK_OVERLAP:-150}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data:/app/data:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

volumes:
  pgvector_data:
